spring.application.name=auth-service
server.port=8081

# ===============================
# DB
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT
# ===============================
jwt.secret=connecthubsupersecretkeyconnecthubsupersecretkey1234567890abcdefghijklmnopqrstuvwxyz
jwt.expiration=86400000

# ===============================
# OAuth Google
# ===============================
spring.security.oauth2.client.registration.google.client-id=${CONNECTHUB_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${CONNECTHUB_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${CONNECTHUB_GOOGLE_REDIRECT_URI:http://localhost:8087/login/oauth2/code/google}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# Logging
# ===============================
logging.level.com.connecthub=DEBUG
logging.level.org.springframework.security=INFO
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ===============================
# Frontend Redirect
# ===============================
app.frontend.oauth-success-url=http://localhost:3000/oauth-success?token=
server.forward-headers-strategy=framework
